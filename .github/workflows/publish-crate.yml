# Publish the phron-image crate to crates.io with Trusted Publishing (OIDC, no token).
# The crate's trusted publisher on crates.io names this repository, this workflow filename
# (publish-crate.yml) and the environment (crates-publish). It runs on ubuntu-latest, like
# publish-npm.yml. release.yml dispatches this on each new tag (a tag pushed with GITHUB_TOKEN
# triggers nothing); it publishes the crate version in the checked-out tree and skips a
# version that is already on crates.io, so dispatching it again is harmless.
name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image's Rust lags a release behind; the workspace requires the latest stable.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The crate and the npm package share one version (`fixed` in .sampo/config.toml), and the
      # tag is v<version>, so a tag that disagrees with the crate means the two drifted apart.
      - name: Skip a version that is already published
        id: version
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "phron-image") | .version')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'phron-net/image publish-crate' \
            "https://crates.io/api/v1/crates/phron-image/$version")
          if [ "$code" = 200 ]; then echo "published=true" >> "$GITHUB_OUTPUT"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.version.outputs.published == 'false'
        id: auth

      # cargo publish builds the packaged crate first, so a broken package never reaches the registry.
      - name: Publish
        if: steps.version.outputs.published == 'false'
        run: cargo publish -p phron-image
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # Install check: the registry index must serve the version just published.
      - name: Verify the version is on crates.io
        if: steps.version.outputs.published == 'false'
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'phron-net/image publish-crate' \
              "https://crates.io/api/v1/crates/phron-image/${{ steps.version.outputs.version }}")
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "phron-image ${{ steps.version.outputs.version }} did not appear on crates.io"; exit 1
