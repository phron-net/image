# Installs @phron/image from the npm registry, as a user would, type-checks the test scripts
# against it, and runs the conformance vectors: natively on Linux x64 and arm64, through the WebAssembly
# fallback with the native package removed, and in workerd, Deno and Vercel's edge-runtime
# through the published `./wasm` and `./workerd` exports (which `napi prepublish` writes only at
# publish time, so CI's dry run never has them). publish-npm.yml calls this after each publish;
# dispatch it by hand to re-check a version. The scripts are TypeScript, run directly by Node
# 26+ and Deno.
name: Verify published packages

on:
  workflow_call:
    inputs:
      version:
        description: "Version to install, with or without a leading v"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version to install, with or without a leading v"
        type: string
        required: true

permissions:
  contents: read

jobs:
  node:
    name: node ${{ matrix.node }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        node: ["26"]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Outside the checkout, so the workspace's own @phron/image cannot shadow the registry copy.
      - name: Install from the registry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/published"
          mkdir -p "$dir" && cd "$dir"
          npm init -y >/dev/null
          npm pkg set type=module
          # npm publishes asynchronously ("Your package is being processed"): 0.2.0 appeared about
          # seven minutes after `npm publish` returned. Wait up to 20 minutes for the version.
          for i in $(seq 1 40); do
            npm view "@phron/image@${VERSION#v}" version --prefer-online 2>/dev/null | grep -q . && break
            [ "$i" = 40 ] && { echo "@phron/image@${VERSION#v} not on npm after 20 minutes"; exit 1; }
            sleep 30
          done
          npm i --prefer-online "@phron/image@${VERSION#v}"
          npm i -D typescript@7.1.0-beta @types/node@^26.6.6
          cp "$GITHUB_WORKSPACE"/bindings/node/tests/published/{node.ts,tsconfig.json} .
          ls node_modules/@phron
          test -f node_modules/@phron/image/README.md || { echo "no README in the package"; exit 1; }
      - name: Type-check against the published types
        working-directory: ${{ runner.temp }}/published
        # tsconfig.json lists node.ts, edge.ts and worker.ts; tsc skips the ones not copied here.
        run: npx tsc -p .
      - name: Native (this runner's Linux package)
        working-directory: ${{ runner.temp }}/published
        run: node node.ts native "$GITHUB_WORKSPACE/conformance/vectors.json"
      - name: WebAssembly fallback (native package removed)
        working-directory: ${{ runner.temp }}/published
        run: |
          rm -rf node_modules/@phron/image-linux-*-gnu
          node node.ts wasm "$GITHUB_WORKSPACE/conformance/vectors.json"

  # The WebAssembly build through the `./workerd` loader with a precompiled module, in each edge
  # runtime the README names.
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.8
      # esbuild and miniflare for tests/workerd/run.ts.
      - run: npm ci
      - name: Install from the registry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/published"
          mkdir -p "$dir" && cd "$dir"
          npm init -y >/dev/null
          npm pkg set type=module
          for i in $(seq 1 40); do
            npm view "@phron/image@${VERSION#v}" version --prefer-online 2>/dev/null | grep -q . && break
            [ "$i" = 40 ] && { echo "@phron/image@${VERSION#v} not on npm after 20 minutes"; exit 1; }
            sleep 30
          done
          npm i --prefer-online "@phron/image@${VERSION#v}" esbuild@0.28.2 edge-runtime@4.0.1
          npm i -D typescript@7.1.0-beta @types/node@^26.6.6
          cp "$GITHUB_WORKSPACE"/bindings/node/tests/published/{worker.ts,deno.ts,edge.ts,tsconfig.json} \
            "$GITHUB_WORKSPACE"/conformance/vectors.json .
      - name: Type-check against the published types
        working-directory: ${{ runner.temp }}/published
        run: npx tsc -p .
      - name: Cloudflare Workers (workerd), the README snippet
        run: node bindings/node/tests/workerd/run.ts "$RUNNER_TEMP/published/worker.ts"
      - name: Deno (type-checked)
        working-directory: ${{ runner.temp }}/published
        run: deno run --check --allow-read --allow-env deno.ts
      - name: Vercel Edge (edge-runtime emulator)
        working-directory: ${{ runner.temp }}/published
        run: node edge.ts
