# A pull request that changes the crate or a language binding must carry a Sampo changeset
# (`.sampo/changesets/*.md`), or the change ships without a version bump or changelog entry.
# Dependency bumps from Renovate, and a PR labelled `no-changeset`, are exempt.
name: Changeset

on:
  pull_request:
    paths:
      - "crates/**"
      - "bindings/**"
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changeset:
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'renovate[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Require a new changeset
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only --diff-filter=A "$BASE"...HEAD | grep -q -E '^\.sampo/changesets/.+\.md$'; then
            echo "A changeset is present."
            exit 0
          fi
          echo "::error::This pull request changes crates/ or bindings/ but adds no changeset. Add .sampo/changesets/<name>.md (see the existing ones in git history, or run 'sampo add'), or label the PR no-changeset if it needs no release."
          exit 1
