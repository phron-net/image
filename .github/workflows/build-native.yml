# Builds the napi addon for both targets in napi.targets: the native Linux x64 binary and the
# threadless WebAssembly fallback (wasm32-wasip1), which serves every other platform, Cloudflare
# Workers and edge runtimes. Reused by ci.yml and publish-npm.yml.
name: Build native

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, wasm32-wasip1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Build
        working-directory: bindings/node
        run: |
          npx napi build --platform --release --target "${{ matrix.target }}" \
            --js native.cjs --dts native.d.cts
          ls -la
      # Everything napi generated for the target: the binary or .wasm, the WASI loaders
      # (phron-image.wasip1*.{cjs,js}) and the platform-independent loader and types.
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: |
            bindings/node/phron-image.*
            bindings/node/native.cjs
            bindings/node/native.d.cts
          if-no-files-found: error
