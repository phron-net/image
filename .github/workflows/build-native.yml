# Builds the napi addon for every platform package. Reused by ci.yml and publish-npm.yml.
name: Build native

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # zig is the linker for the musl cross builds (`napi build -x`).
      - uses: mlugg/setup-zig@v2
        if: matrix.cross
      - run: npm ci
      - name: Build
        shell: bash
        working-directory: bindings/node
        run: |
          set -euo pipefail
          flags=""
          if [ "${{ matrix.cross }}" = "true" ]; then flags="-x"; fi
          npx napi build --platform --release --target "${{ matrix.target }}" \
            --js native.cjs --dts native.d.cts $flags
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: |
            bindings/node/*.node
            bindings/node/native.cjs
            bindings/node/native.d.cts
          if-no-files-found: error
