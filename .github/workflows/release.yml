# Version-and-tag: `sampo release` turns pending changesets into a version bump and CHANGELOG
# entries, this workflow commits them and pushes the `v<version>` tag, and the tag runs
# publish-npm.yml. Sampo never runs `publish` here: the npm packages are built and published by
# publish-npm.yml, where the platform binaries exist.
name: Release

on:
  push:
    branches: [main]
    paths:
      - ".sampo/changesets/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # gh workflow run publish-npm.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # sampo reads history and existing tags

      - uses: bruits/sampo/crates/sampo-github-action@cargo-sampo-github-action-v0.22.1
        with:
          command: release
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Pushed with GITHUB_TOKEN on purpose: it triggers no workflow, so the release commit is
      # not built twice. The tag below is what builds.
      - name: Commit the release
        id: commit
        run: |
          set -euo pipefail
          # A runner has no git identity; commit as GitHub's Actions bot.
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add bindings/node/package.json bindings/node/CHANGELOG.md package-lock.json .sampo/changesets
          if git diff --cached --quiet; then echo "released=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "chore(release): version packages"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./bindings/node/package.json').version")" >> "$GITHUB_OUTPUT"

      # A tag pushed with GITHUB_TOKEN triggers no workflow, but a `workflow_dispatch` started
      # with it does. So push the tag, then dispatch publish-npm.yml on that tag. No GitHub App
      # key is needed, and the npm Trusted Publisher still sees the workflow file publish-npm.yml.
      - name: Tag the release and start the publish
        if: steps.commit.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.commit.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh workflow run publish-npm.yml --ref "v${VERSION}"
