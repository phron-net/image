# Publish @phron/image and its platform packages to npm with Trusted Publishing (OIDC, no token).
# Each npm package's settings must name this repository, the workflow filename (publish-npm.yml)
# and the environment (npm-publish): the root package and all seven platform packages
# (@phron/image-<platform>). npm rejects self-hosted runners, so the publish job runs on
# ubuntu-latest. Triggered by the `v*` tag that release.yml pushes after `sampo release`.
name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p phron-image

  native:
    needs: [rust]
    uses: ./.github/workflows/build-native.yml

  publish:
    needs: [native]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          # Needed even for OIDC. Do not set NODE_AUTH_TOKEN: a static token would win over OIDC.
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11
      - run: npm ci

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          version=$(node -p "require('./bindings/node/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          path: bindings/node/artifacts

      # One directory per platform package, then the downloaded binaries moved into them.
      - name: Assemble the platform packages
        working-directory: bindings/node
        run: |
          set -euo pipefail
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts --npm-dir npm
          # The loader and types are platform-independent: every build writes the same ones.
          cp artifacts/bindings-x86_64-unknown-linux-gnu/native.cjs artifacts/bindings-x86_64-unknown-linux-gnu/native.d.cts .
          ls npm/*

      # tsc imports ../native.d.cts, so it runs only after the loader and types are in place.
      - name: Build the TypeScript
        working-directory: bindings/node
        run: npm run build

      # `prepublishOnly` (`napi prepublish -t npm`) publishes the platform packages first, then
      # npm publishes the root package, whose optionalDependencies now name them.
      - name: Publish
        working-directory: bindings/node
        run: npm publish --access public
