name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public repository: these run on GitHub-hosted runners (a self-hosted runner on a public repo
# would execute fork pull requests). The native build matrix needs macOS and Windows anyway.
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The runner image's Rust lags a release behind; the workspace requires the latest stable.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The first unlocked step above rewrites Cargo.lock if it does not match the
      # manifests; the diff printed here is the edit to commit (the workstation cannot
      # resolve the lock itself).
      - name: Cargo.lock is current
        run: git diff --exit-code -- Cargo.lock
      # The core crate, including the shared conformance vectors.
      - run: cargo test -p phron-image

  node:
    needs: [rust]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["26"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: npm ci
      - run: npx biome check .
      # The binding and its generated loader and types, which the TypeScript below needs.
      - run: npm run build:native:debug -w @phron/image
      - run: npm run typecheck -w @phron/image
      - run: npm test -w @phron/image
      - run: npm run build -w @phron/image
      - name: Package contents
        run: npm pack -w @phron/image --dry-run

  # The WebAssembly fallback: the same vectors in Node through WASI, then inside workerd.
  wasm:
    needs: [rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: wasm32-wasip1
      - run: npm ci
      - name: Build the wasm32-wasip1 target
        working-directory: bindings/node
        run: |
          npx napi build --platform --target wasm32-wasip1 --js native.cjs --dts native.d.cts
          ls -la
      # Only the WebAssembly build exists here (no .node file, no platform package), so the
      # loader can only succeed through WASI. NAPI_RS_FORCE_WASI is not used: it is process-wide,
      # and vitest's own napi-rs bundler (rolldown) obeys it too and fails to start.
      - name: Vectors in Node through WebAssembly
        run: |
          set -euo pipefail
          if ls bindings/node/*.node node_modules/@phron/image-linux-* >/dev/null 2>&1; then
            echo "a native binding is present; this job must test WebAssembly only"; exit 1
          fi
          npm test -w @phron/image
      - name: Type-check the workerd test against the build
        working-directory: bindings/node
        run: npx tsc -p tests/workerd
      - name: Vectors in workerd
        working-directory: bindings/node
        run: node tests/workerd/run.ts
      # The vectors come from an implementation that shares no code with the binding; the
      # committed file must be exactly what it writes.
      - name: Conformance vectors are current
        run: |
          set -euo pipefail
          npx tsc -p conformance
          npm run conformance:generate
          git diff --exit-code conformance/vectors.json

  # Both napi targets, as the publish workflow builds them.
  native:
    needs: [rust]
    uses: ./.github/workflows/build-native.yml

  # Each release binary on its own CPU, inside Debian 11 (glibc 2.31). A binary linked against
  # the runner's glibc would not load there; the cross-built ones (glibc 2.17) must. No WebAssembly
  # package is installed, so a binary that fails to load fails the tests.
  native-test:
    name: native-test / ${{ matrix.target }}
    needs: [native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: node:26-bullseye
    defaults:
      run:
        shell: bash # a container job's default shell is sh, which lacks pipefail
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node
      - name: Vectors through the release binary
        run: |
          set -euo pipefail
          getconf GNU_LIBC_VERSION
          ls bindings/node/*.node
          if ls bindings/node/*.wasm node_modules/@phron/image-wasm32-* >/dev/null 2>&1; then
            echo "a WebAssembly build is present; this job must test the native binary only"; exit 1
          fi
          npm test -w @phron/image

  # The release layout, assembled as publish-npm.yml does it, then a prepublish dry run and the
  # contents of every package that would be published. Nothing is published.
  package:
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          path: bindings/node/artifacts
      - name: Assemble the platform packages
        working-directory: bindings/node
        run: |
          set -euo pipefail
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts --npm-dir npm
          cp artifacts/bindings-x86_64-unknown-linux-gnu/native.cjs artifacts/bindings-x86_64-unknown-linux-gnu/native.d.cts .
          npm run build
      - name: Prepublish dry run
        working-directory: bindings/node
        run: npx napi prepublish -t npm --no-gh-release --dry-run
      - name: Package contents
        working-directory: bindings/node
        run: |
          set -euo pipefail
          for dir in npm/*/ .; do
            echo "::group::$dir"
            cat "$dir/package.json"
            (cd "$dir" && npm pack --dry-run)
            echo "::endgroup::"
          done
      # npm takes the package page from the package directory; prepack copies the root's files.
      - name: The root package carries the README and LICENSE
        working-directory: bindings/node
        run: |
          set -euo pipefail
          listing=$(npm pack --dry-run 2>&1)
          for f in README.md LICENSE; do
            grep -qE "notice .* ${f}\$" <<<"$listing" || { echo "missing $f"; exit 1; }
          done
