name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public repository: these run on GitHub-hosted runners (a self-hosted runner on a public repo
# would execute fork pull requests). The native build matrix needs macOS and Windows anyway.
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The core crate, including the shared conformance vectors.
      - run: cargo test -p phron-image
      - uses: actions/upload-artifact@v7
        with:
          name: lockfile
          path: Cargo.lock

  node:
    needs: [rust]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx biome check .
      # The binding and its generated loader and types, which the TypeScript below needs.
      - run: npm run build:native:debug -w @phron/image
      - run: npm run typecheck -w @phron/image
      - run: npm test -w @phron/image
      - run: npm run build -w @phron/image
      - name: Package contents
        run: npm pack -w @phron/image --dry-run

  # Every platform package: proves the binding compiles on each target.
  native:
    needs: [rust]
    uses: ./.github/workflows/build-native.yml
