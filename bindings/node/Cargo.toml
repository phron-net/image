[package]
name = "phron-image-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Node.js binding (napi-rs) for the phron-image core; ships as the @phron/image npm package"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
phron-image = { path = "../../crates/phron-image" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

# The `#[napi]` macro emits `#[allow(unsafe_code)]` on its generated FFI symbols, which a
# workspace-level `forbid` would reject. `deny` keeps hand-written code free of `unsafe`.
[lints.rust]
unsafe_code = "deny"
