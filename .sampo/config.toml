# Sampo configuration. See https://github.com/bruits/sampo and the multi-language-sdk skill.
version = 1

[git]
default_branch = "main"

[github]
repository = "phron-net/image"

[changesets]
tags = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]

[changelog]
show_commit_hash = true
show_acknowledgments = true
show_release_date = true
release_date_format = "%Y-%m-%d"
release_date_timezone = "UTC"

[packages]
ignore_unpublished = false
# phron-image is released to crates.io by publish-crate.yml. The Node binding crate ships only as
# the npm package. Sampo reads literal `publish = false` only, not an inherited one, so it is
# listed here by its `cargo/` canonical identifier.
ignore = ["cargo/phron-image-node"]
